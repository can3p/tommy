name: Release

on:
  push:
    tags:
      - "v*"
  # The Docker Hub page can be corrected without cutting a release.
  workflow_dispatch:

permissions:
  contents: write
  # The GHCR mirror pushes as the workflow itself; Docker Hub uses the PAT
  # below. That is the only reason there is no second registry secret.
  packages: write

jobs:
  goreleaser:
    name: GoReleaser
    # A manual run exists to refresh the Docker Hub description; there is no
    # tag to release from.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # dockers_v2 builds a linux/amd64 + linux/arm64 manifest with buildx, so
      # the runner needs emulation for the architecture it is not.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GoReleaser does not log in to registries itself, so both logins have to
      # happen before it runs or the push fails at the very end of a release.
      # The account name is not a credential, so a repository variable is the
      # natural home for it - but it is just as reasonable to keep it beside the
      # token as a secret, which is how this repository has it. Accept either,
      # because the failure otherwise is a bare "Username required" at the end
      # of a release with nothing pointing at the cause.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          BUILD_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dockerhub-description:
    name: Docker Hub description
    runs-on: ubuntu-latest
    # On a tag the page is refreshed with the release it describes, so nobody
    # has to remember. needs: the description should not claim a version the
    # push failed to produce.
    needs: [goreleaser]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.goreleaser.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Docker Hub caps the short description at 100 bytes and the full one at
      # 25,000, and the action truncates silently past either. Both live in
      # docs/dockerhub.md - the short one in its front matter - and a test in
      # the repository holds them under the caps, so this step only has to read
      # the file, not police it.
      - name: Read the short description
        id: short
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re
          text = pathlib.Path("docs/dockerhub.md").read_text()
          m = re.search(r"^<!--\s*short_description:\s*(.*?)\s*-->\s*$", text, re.M)
          if not m:
              raise SystemExit("docs/dockerhub.md has no <!-- short_description: ... --> line")
          print(f"value={m.group(1).strip()}")
          PY

      # DOCKERHUB_TOKEN must be a Personal Access Token with **read/write/delete**
      # scope. Pushing an image needs only read/write, so a narrower token
      # releases perfectly well and then fails here - which is exactly what
      # happened on v0.1.0-rc2.
      #
      # Why the delete scope unlocks an *edit* is not documented anywhere by
      # Docker: their access-token documentation describes the scopes purely in
      # terms of pulling, pushing and deleting images, and does not mention this
      # endpoint at all. What is documented is the action's own requirement, and
      # Docker Hub's scopes are offered as cumulative tiers rather than
      # independent permissions, so the likeliest reading is that repository
      # administration simply sits in the top tier. Recorded as an observation
      # rather than an explanation, because that is what it is.
      - name: Publish it
        id: publish
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: can3p/tommy
          short-description: ${{ steps.short.outputs.value }}
          readme-filepath: ./docs/dockerhub.md

      # The action reports a bare "Forbidden", which says nothing about what to
      # do. This job stays red when it fails - a page that silently stops being
      # refreshed is the drift the whole arrangement exists to prevent - but the
      # log should at least name the fix.
      - name: Explain a failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ### Docker Hub description was not updated

          The image published; only the description call failed.

          `PATCH /v2/repositories/can3p/tommy/` answers `403 Forbidden` unless the
          token carries the delete scope as well - a token with **Read & Write**
          pushes images perfectly well and fails only here. Docker does not
          document why; the action requires it and the scopes are cumulative
          tiers, so repository administration appears to sit in the top one.

          **Fix:** create a Personal Access Token with **Read, Write, Delete**
          scope (Docker Hub → Account settings → Personal access tokens), replace
          the `DOCKERHUB_TOKEN` repository secret with it, and re-run this
          workflow from the Actions tab — `workflow_dispatch` refreshes the page
          without cutting another release.

          Other things that produce the same status: the `can3p/tommy` repository
          does not exist yet (push-to-create runs after this job on a first
          release), or the account is not an owner of it.
          MD
          echo "::error::Docker Hub description not updated - DOCKERHUB_TOKEN likely lacks read/write/delete scope. See the job summary."
          exit 1
